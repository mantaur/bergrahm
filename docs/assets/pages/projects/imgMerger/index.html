  <!-- Worker source embedded so the page works from file:// without a server.
       The type attribute prevents the browser from executing it as a script. -->
  <script type="text/js-worker" id="merge-worker-src">
// ── Image Merger — Web Worker (polygon-based) ─────────────────────────────────
const COARSE_STEP  = 400;
const FINE_STEP    = 20;
const FINE_RADIUS  = 200;
const TOP_K        = 10;

// Mutable overrides — set per-message so preview runs can use scaled constants.
let gCoarseStep = COARSE_STEP;
let gFineStep   = FINE_STEP;
let gFineRadius = FINE_RADIUS;
let gTopK       = TOP_K;
let gSilent     = false;

self.onmessage = function (e) {
  const { images, rankOrder, outW, outH, minScale, maxScale, useScaleRange, blendMode, seed, ditherExp,
          coarseStep, fineStep, fineRadius, topK, silent, precomputedPlacements } = e.data;

  // Shortcut: skip placement search, compute ownership map only.
  if (precomputedPlacements) {
    try {
      const ownershipMap = computeOwnershipMap(images, precomputedPlacements, outW, outH, blendMode, seed | 0, Math.max(1, ditherExp | 0) || 4);
      self.postMessage({ type: 'done', placements: precomputedPlacements, ownershipMap }, [ownershipMap.buffer]);
    } catch (err) {
      self.postMessage({ type: 'error', text: err.message });
    }
    return;
  }

  gCoarseStep = coarseStep  || COARSE_STEP;
  gFineStep   = fineStep    || FINE_STEP;
  gFineRadius = fineRadius  || FINE_RADIUS;
  gTopK       = topK        || TOP_K;
  gSilent     = !!silent;
  try {
    const { placements, ownershipMap } = runMerge(images, rankOrder, outW, outH, minScale, maxScale, useScaleRange, blendMode, seed, ditherExp);
    self.postMessage({ type: 'done', placements, ownershipMap }, [ownershipMap.buffer]);
  } catch (err) {
    self.postMessage({ type: 'error', text: err.message });
  }
};

function postLog(text, cls) {
  if (gSilent) return;
  self.postMessage({ type: 'log', text, cls: cls || '' });
}

function postProgress(pct) {
  self.postMessage({ type: 'progress', pct: Math.round(pct) });
}

function runMerge(images, rankOrder, W, H, minScale, maxScale, useScaleRange, blendMode, seed, ditherExp) {
  const forbiddenTris = [];
  const placements    = [];

  for (let ri = 0; ri < rankOrder.length; ri++) {
    const imgIdx = rankOrder[ri];
    const entry  = images[imgIdx];
    postLog('Placing [' + entry.name + '] (rank ' + (ri + 1) + ') scale=' + entry.scale.toFixed(2) + 'x...');

    entry.triangles = [];
    for (const poly of entry.polygons) {
      const tris = triangulate(poly);
      for (const t of tris) entry.triangles.push(t);
    }

    if (entry.triangles.length === 0) {
      postLog('  -> No essential polygons - placed at (0,0) scale=' + entry.scale.toFixed(2) + 'x.');
      placements.push({ imgIdx, x: 0, y: 0, scale: entry.scale });
      continue;
    }

    entry.bbox = trianglesBbox(entry.triangles);

    // For manually-scaled images, or when scale-range search is off, use the
    // single resolved scale. Otherwise search min/default/max and keep the best.
    const scales = (entry.scaleFixed || !useScaleRange)
      ? [entry.scale]
      : [...new Set([minScale, entry.scale, maxScale])];
    let bestScore = -Infinity, bestPlacement = null;
    const origScale = entry.scale;
    try {
      for (const s of scales) {
        entry.scale = s;
        const { bestScore: sc, bestPlacement: pl } = findBestPlacement(entry, forbiddenTris, W, H);
        if (sc > bestScore) { bestScore = sc; bestPlacement = pl; }
      }
    } finally {
      entry.scale = origScale;
    }

    if (bestPlacement === null || bestScore < 0) {
      postLog('  -> Could not find a valid placement - skipped.', 'im-log-warn');
      continue;
    }

    const { tx: x, ty: y, s: scale } = bestPlacement;
    postLog('  -> Placed at (' + x + ', ' + y + ') scale=' + scale.toFixed(2) + 'x  score=' + bestScore, 'im-log-ok');
    placements.push({ imgIdx, x, y, scale });
    markEssentials(forbiddenTris, entry.triangles, x, y, scale);
  }

  postLog('Computing ownership map...');
  const ownershipMap = computeOwnershipMap(images, placements, W, H, blendMode, seed, ditherExp);
  return { placements, ownershipMap };
}

function findBestPlacement(entry, forbiddenTris, W, H) {
  const s       = entry.scale;
  const scaledW = Math.round(entry.w * s);
  const scaledH = Math.round(entry.h * s);
  const xMin    = -(scaledW - 1), xMax = W - 1;
  const yMin    = -(scaledH - 1), yMax = H - 1;
  const forbiddenBbox = forbiddenTris.length > 0 ? bboxUnion(forbiddenTris.map(t => t.bbox)) : null;
  const topK = [];

  for (let tx = xMin; tx <= xMax; tx += gCoarseStep) {
    for (let ty = yMin; ty <= yMax; ty += gCoarseStep) {
      const score = scorePlacement(entry, s, tx, ty, forbiddenTris, forbiddenBbox, W, H);
      if (topK.length < gTopK || score > topK[topK.length - 1].score) {
        topK.push({ tx, ty, score });
        topK.sort((a, b) => b.score - a.score);
        if (topK.length > gTopK) topK.pop();
      }
    }
  }

  if (topK.length === 0) return { bestScore: -Infinity, bestPlacement: null };

  let bestScore = -Infinity, bestPlacement = null;

  for (const { tx: cx, ty: cy } of topK) {
    const xLo = Math.max(xMin, cx - gFineRadius);
    const xHi = Math.min(xMax, cx + gFineRadius);
    const yLo = Math.max(yMin, cy - gFineRadius);
    const yHi = Math.min(yMax, cy + gFineRadius);

    for (let tx = xLo; tx <= xHi; tx += gFineStep) {
      for (let ty = yLo; ty <= yHi; ty += gFineStep) {
        const score = scorePlacement(entry, s, tx, ty, forbiddenTris, forbiddenBbox, W, H);
        if (score > bestScore) { bestScore = score; bestPlacement = { tx, ty, s }; }
      }
    }
  }

  return { bestScore, bestPlacement };
}

function scorePlacement(entry, scale, tx, ty, forbiddenTris, forbiddenBbox, W, H) {
  const s2 = scale * scale; // area weight — larger placements score proportionally more
  const ob = transformBbox(entry.bbox, tx, ty, scale);
  if (ob.maxX < 0 || ob.minX >= W || ob.maxY < 0 || ob.minY >= H) return -entry.triangles.length * s2;
  const skipForbidden = !forbiddenBbox || !bboxOverlap(ob, forbiddenBbox);
  let score = 0;
  for (const srcTri of entry.triangles) {
    const t  = transformTri(srcTri, tx, ty, scale);
    const cx = (t[0].x + t[1].x + t[2].x) / 3;
    const cy = (t[0].y + t[1].y + t[2].y) / 3;
    if (cx < 0 || cy < 0 || cx >= W || cy >= H) { score -= s2; continue; }
    if (skipForbidden) { score += s2; continue; }
    const tb = triBbox(t);
    let hit = false;
    for (const ft of forbiddenTris) {
      if (bboxOverlap(tb, ft.bbox) && trisOverlap(t, ft.verts)) { hit = true; break; }
    }
    score += hit ? -2 * s2 : s2;
  }
  return score;
}

function markEssentials(forbiddenTris, srcTriangles, tx, ty, scale) {
  for (const srcTri of srcTriangles) {
    const verts = transformTri(srcTri, tx, ty, scale);
    forbiddenTris.push({ verts, bbox: triBbox(verts) });
  }
}

function transformTri(tri, tx, ty, scale) {
  return tri.map(v => ({ x: tx + v.x * scale, y: ty + v.y * scale }));
}

function triBbox(tri) {
  return {
    minX: Math.min(tri[0].x, tri[1].x, tri[2].x),
    minY: Math.min(tri[0].y, tri[1].y, tri[2].y),
    maxX: Math.max(tri[0].x, tri[1].x, tri[2].x),
    maxY: Math.max(tri[0].y, tri[1].y, tri[2].y),
  };
}

function trianglesBbox(tris) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const tri of tris) for (const v of tri) {
    if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
    if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
  }
  return { minX, minY, maxX, maxY };
}

function transformBbox(bbox, tx, ty, scale) {
  return { minX: tx + bbox.minX * scale, minY: ty + bbox.minY * scale,
           maxX: tx + bbox.maxX * scale, maxY: ty + bbox.maxY * scale };
}

function bboxOverlap(a, b) {
  return a.maxX >= b.minX && b.maxX >= a.minX && a.maxY >= b.minY && b.maxY >= a.minY;
}

function bboxUnion(bboxes) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const b of bboxes) {
    if (b.minX < minX) minX = b.minX; if (b.maxX > maxX) maxX = b.maxX;
    if (b.minY < minY) minY = b.minY; if (b.maxY > maxY) maxY = b.maxY;
  }
  return { minX, minY, maxX, maxY };
}

function trisOverlap(t1, t2) {
  for (const tri of [t1, t2]) {
    for (let i = 0; i < 3; i++) {
      const a = tri[i], b = tri[(i + 1) % 3];
      const nx = -(b.y - a.y), ny = b.x - a.x;
      let mn1 = Infinity, mx1 = -Infinity, mn2 = Infinity, mx2 = -Infinity;
      for (const v of t1) { const p = v.x*nx + v.y*ny; if (p < mn1) mn1=p; if (p > mx1) mx1=p; }
      for (const v of t2) { const p = v.x*nx + v.y*ny; if (p < mn2) mn2=p; if (p > mx2) mx2=p; }
      if (mx1 < mn2 || mx2 < mn1) return false;
    }
  }
  return true;
}

function triangulate(polygon) {
  if (polygon.length < 3) return [];
  if (polygon.length === 3) return [[polygon[0], polygon[1], polygon[2]]];
  const verts = ensureCW(polygon).map(v => ({ x: v.x, y: v.y }));
  const result = [];
  let safety = verts.length * verts.length + 10;
  while (verts.length > 3 && safety-- > 0) {
    let clipped = false;
    for (let i = 0; i < verts.length; i++) {
      const prev = verts[(i - 1 + verts.length) % verts.length];
      const curr = verts[i];
      const next = verts[(i + 1) % verts.length];
      if (isEar(prev, curr, next, verts)) {
        result.push([prev, curr, next]);
        verts.splice(i, 1);
        clipped = true;
        break;
      }
    }
    if (!clipped) break;
  }
  if (verts.length === 3) result.push([verts[0], verts[1], verts[2]]);
  return result;
}

function signedArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const j = (i + 1) % poly.length;
    a += poly[i].x * poly[j].y - poly[j].x * poly[i].y;
  }
  return a / 2;
}

function ensureCW(poly) { return signedArea(poly) > 0 ? poly : poly.slice().reverse(); }

function cross2d(o, a, b) {
  return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
}

function isEar(prev, curr, next, verts) {
  if (cross2d(prev, curr, next) <= 0) return false;
  for (const v of verts) {
    if (v === prev || v === curr || v === next) continue;
    if (pointInTriangle(v, prev, curr, next)) return false;
  }
  return true;
}

function pointInTriangle(p, a, b, c) {
  const ab = cross2d(a, b, p), bc = cross2d(b, c, p), ca = cross2d(c, a, p);
  return (ab >= 0 && bc >= 0 && ca >= 0) || (ab <= 0 && bc <= 0 && ca <= 0);
}

// ── Ownership map dispatcher ───────────────────────────────────────────────────
function computeOwnershipMap(images, placements, W, H, blendMode, seed, ditherExp) {
  if (blendMode === 'dither') return computeDitherMap(images, placements, W, H, seed | 0, Math.max(1, ditherExp | 0) || 4);
  return computeVoronoiMap(images, placements, W, H);
}

// Transform a single vertex from image space to output space,
// applying scale, rotation around pivot, and placement.
function transformPolyVert(v, p) {
  const angle = p.angle || 0;
  if (!angle) return { x: p.x + v.x * p.scale, y: p.y + v.y * p.scale };
  const lx = v.x * p.scale - p.imgCentroidX;
  const ly = v.y * p.scale - p.imgCentroidY;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return {
    x: p.pivotX + lx * cos - ly * sin,
    y: p.pivotY + lx * sin + ly * cos,
  };
}

// ── Voronoi ownership map ──────────────────────────────────────────────────────
// Returns Int16Array(W*H): each cell holds the imgIdx of the image whose
// essential region is nearest, or -1 if no image has any polygons.
function computeVoronoiMap(images, placements, W, H) {
  const ownerMap = new Int16Array(W * H).fill(-1);
  const minDist  = new Float32Array(W * H).fill(Infinity);
  const mask     = new Uint8Array(W * H);
  const N = placements.length;

  for (let k = 0; k < N; k++) {
    const p = placements[k];
    const entry = images[p.imgIdx];
    if (!entry.polygons || entry.polygons.length === 0) {
      postProgress(Math.round((k + 1) / Math.max(N, 1) * 100));
      continue;
    }

    // Transform polygons from source space to output space
    const outPolys = entry.polygons.map(poly =>
      poly.map(v => transformPolyVert(v, p))
    );

    mask.fill(0);
    rasterizePolygons(outPolys, W, H, mask);
    const dist = chamferDist(mask, W, H);

    for (let i = 0; i < W * H; i++) {
      if (dist[i] < minDist[i]) {
        minDist[i] = dist[i];
        ownerMap[i] = p.imgIdx;
      }
    }
    postProgress(Math.round((k + 1) / Math.max(N, 1) * 100));
  }

  return ownerMap;
}

// ── Dither ownership map ───────────────────────────────────────────────────────
// Each pixel is assigned to an image by weighted random sampling.
// Weight = 1 / (chamferDist + 1). Essential-region pixels (dist=0) always win.
// Only images whose bounding box covers the pixel are eligible (per-user spec).
function computeDitherMap(images, placements, W, H, seed, exp) {
  const N       = placements.length;
  const ownerMap = new Int16Array(W * H).fill(-1);
  if (N === 0) return ownerMap;

  const distMaps = new Array(N).fill(null);
  const bboxes   = new Array(N).fill(null);
  const mask     = new Uint8Array(W * H);

  for (let k = 0; k < N; k++) {
    const p     = placements[k];
    const entry = images[p.imgIdx];
    if (!entry.polygons || entry.polygons.length === 0) {
      postProgress(Math.round((k + 1) / N * 40));
      continue;
    }

    const outPolys = entry.polygons.map(poly =>
      poly.map(v => transformPolyVert(v, p))
    );
    mask.fill(0);
    rasterizePolygons(outPolys, W, H, mask);
    distMaps[k] = chamferDist(mask, W, H);
    // Compute AABB of (possibly rotated) image corners
    const corners = [
      { x: 0, y: 0 }, { x: entry.w, y: 0 },
      { x: entry.w, y: entry.h }, { x: 0, y: entry.h },
    ].map(c => transformPolyVert(c, p));
    const cxs = corners.map(c => c.x), cys = corners.map(c => c.y);
    bboxes[k] = {
      x0: Math.max(0,     Math.floor(Math.min(...cxs))),
      y0: Math.max(0,     Math.floor(Math.min(...cys))),
      x1: Math.min(W - 1, Math.ceil(Math.max(...cxs))),
      y1: Math.min(H - 1, Math.ceil(Math.max(...cys))),
    };
    postProgress(Math.round((k + 1) / N * 40));
  }

  // Indices of placements that have polygon data
  const active = [];
  for (let k = 0; k < N; k++) { if (distMaps[k] !== null) active.push(k); }
  if (active.length === 0) return ownerMap;

  const covering   = new Int32Array(active.length); // reused per pixel
  const reportStep = Math.max(1, Math.round(H / 20)); // ~20 progress updates

  for (let y = 0; y < H; y++) {
    if (y % reportStep === 0) postProgress(40 + Math.round(y / H * 60));
    for (let x = 0; x < W; x++) {
      const i = y * W + x;

      // Gather active placements whose bbox covers (x, y)
      let nCov = 0;
      for (const k of active) {
        const bb = bboxes[k];
        if (x >= bb.x0 && x <= bb.x1 && y >= bb.y0 && y <= bb.y1) {
          covering[nCov++] = k;
        }
      }
      if (nCov === 0) continue;
      if (nCov === 1) { ownerMap[i] = placements[covering[0]].imgIdx; continue; }

      // Essential region (dist=0) — first covering wins (= highest rank)
      let essentialOwner = -1;
      for (let j = 0; j < nCov; j++) {
        if (distMaps[covering[j]][i] === 0) { essentialOwner = placements[covering[j]].imgIdx; break; }
      }
      if (essentialOwner !== -1) { ownerMap[i] = essentialOwner; continue; }

      // Find the two covering placements with smallest chamfer distance.
      // Blending only between the two nearest avoids sampling a far-away image
      // whose essential region is on the opposite side of the canvas.
      let d0 = Infinity, d1 = Infinity, k0 = covering[0], k1 = covering[1];
      for (let j = 0; j < nCov; j++) {
        const d = distMaps[covering[j]][i];
        if (d < d0) { d1 = d0; k1 = k0; d0 = d; k0 = covering[j]; }
        else if (d < d1) { d1 = d; k1 = covering[j]; }
      }

      // p(k0) = d1^exp / (d0^exp + d1^exp) — higher exp = narrower blend band.
      const w0 = Math.pow(d1, exp);
      const w1 = Math.pow(d0, exp);
      ownerMap[i] = placements[pixelRand(seed, i) < w0 / (w0 + w1) ? k0 : k1].imgIdx;
    }
  }

  return ownerMap;
}

// Wang hash — deterministic float in [0, 1) from seed + pixel index.
function pixelRand(seed, idx) {
  let h = ((seed >>> 0) ^ (idx >>> 0)) >>> 0;
  h = ((h ^ 61) ^ (h >>> 16)) >>> 0;
  h = (h + (h << 3))          >>> 0;
  h = (h ^ (h >>> 4))         >>> 0;
  h = Math.imul(h, 0x27d4eb2d) >>> 0;
  h = (h ^ (h >>> 15))        >>> 0;
  return h / 4294967296;
}

// Scanline-fill all polygons into mask (1 = inside, output space).
function rasterizePolygons(polygons, W, H, mask) {
  for (const poly of polygons) {
    if (poly.length < 3) continue;
    let minY = Infinity, maxY = -Infinity;
    for (const v of poly) { if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y; }
    minY = Math.max(0, Math.floor(minY));
    maxY = Math.min(H - 1, Math.ceil(maxY));
    const n = poly.length;
    for (let y = minY; y <= maxY; y++) {
      const xs = [];
      for (let i = 0; i < n; i++) {
        const a = poly[i], b = poly[(i + 1) % n];
        if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
          xs.push(a.x + (y - a.y) / (b.y - a.y) * (b.x - a.x));
        }
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const x0 = Math.max(0, Math.ceil(xs[k]));
        const x1 = Math.min(W - 1, Math.floor(xs[k + 1]));
        for (let x = x0; x <= x1; x++) mask[y * W + x] = 1;
      }
    }
  }
}


// 2-pass chamfer distance transform (3-4 weights).
// Returns Float32Array(W*H): 0 at seed pixels, distance elsewhere.
function chamferDist(mask, W, H) {
  const INF = 1e9;
  const d = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) d[i] = mask[i] ? 0 : INF;

  // Forward pass (top-left → bottom-right)
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (d[i] === 0) continue;
      let v = d[i];
      if (x > 0)         v = Math.min(v, d[i - 1]     + 3);
      if (y > 0) {
        if (x > 0)       v = Math.min(v, d[i - W - 1] + 4);
                         v = Math.min(v, d[i - W]     + 3);
        if (x < W - 1)   v = Math.min(v, d[i - W + 1] + 4);
      }
      d[i] = v;
    }
  }

  // Backward pass (bottom-right → top-left)
  for (let y = H - 1; y >= 0; y--) {
    for (let x = W - 1; x >= 0; x--) {
      const i = y * W + x;
      if (d[i] === 0) continue;
      let v = d[i];
      if (x < W - 1)     v = Math.min(v, d[i + 1]     + 3);
      if (y < H - 1) {
        if (x < W - 1)   v = Math.min(v, d[i + W + 1] + 4);
                         v = Math.min(v, d[i + W]     + 3);
        if (x > 0)       v = Math.min(v, d[i + W - 1] + 4);
      }
      d[i] = v;
    }
  }

  return d;
}
